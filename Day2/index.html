<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Management System</title>
     <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Welcome to the Intern Management System</h1>
         <a href="./pages/cart/cart.html" id="view-cart">Cart (0)</a>
    </header>

    <main>
        <h2>Available Products</h2>
        <section class="product-controls">
          <input
                type="search"
                id="product-search"
                placeholder="Search by product name or ID..."
            >
             <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Clothing">Clothing</option>
                <option value="Home Appliances">Home Appliances</option>
            </select>
              <select id="price-sort">
                <option value="none">Sort by Price</option>
                <option value="asc">Price: Low to High</option>
                <option value="desc">Price: High to Low</option>
            </select> 
            </section>
        <section id="products-container" class="product-container">
           
        </section>
         
    </main>
        <script  type=module src= "./script.js" ></script>
     <footer>
        <p>&copy; 2026 Intern Management System</p>
    </footer> 

</body>
</html>
